<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title -->
    <title>Github Issues Tracker | Home Page</title>

    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <!-- tailwind + daisyUI  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- stylesheet -->
     <link rel="stylesheet" href="tailwind.css">
</head>
<body class="bg-base-200 geist-font">
    
    <!-- Main section  -->
    <main class="container mx-auto px-5 md:px-7">

        <!-- navbar -->
        <nav class="mb-10 p-4 bg-base-100 shadow rounded-md flex justify-center lg:justify-between items-center flex-wrap gap-5">
            <!-- logo and name -->
            <div class="flex items-center gap-1">
                <span class="text-2xl"><i class="fa-brands fa-github"></i></span>
                <h2 class="font-semibold text-2xl">GitHub Issues Tracker</h2>
            </div>

            <!-- search input and button -->
             <div class="flex items-center gap-2">
                <div class="w-4/5">
                    <label class="input">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                      <g
                        stroke-linejoin="round"
                        stroke-linecap="round"
                        stroke-width="2.5"
                        fill="none"
                        stroke="currentColor"
                      >
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                      </g>
                    </svg>
                    <input id="input-search" type="search" required placeholder="Search issues..." />
                    <label>
                </div>

                <button id="btn-search" class="btn btn-primary text-base font-semibold">+ New Issue</button>
             </div>
        </nav>


        <!-- tab section -->
         <section class="flex gap-3 p-4 rounded-md bg-base-100 shadow mb-4">
            <button onclick="loadCard()" class="btn btn-primary px-6">All</button>
            <button onclick="loadOpenCard()" class="btn px-6">Open</button>
            <button onclick="loadClosedCard()" class="btn px-6">Closed</button>
         </section>


         <!-- issues count section -->
          <section class="p-4 rounded-md bg-base-100 shadow mb-4 flex flex-col sm:flex-row justify-between sm:items-center gap-4">

            <!-- count text box and description -->
            <div class="flex gap-4 sm:gap-2 items-center">
                <img class="bg-[#ECE4FF] p-2 rounded-full" src="./assets/Aperture.png" alt="">
                <div>
                    <h2 id="count-card" class="text-xl font-semibold"></h2>
                    <p class="text-[#64748B] text-base tracking-wider">Track and manage your project issues</p>
                </div>
            </div>

            <!-- open and closed color and text -->
            <div class="flex items-center justify-between gap-6 sm:gap-3 mx-2">

                <!-- open text and color ball -->
              <div class="flex gap-2 items-center">
                 <div class="size-3 rounded-full bg-green-600"></div>
                 <h2 class="font-medium text-base">Open</h2>
              </div>
                <!-- closed text and color ball --> 
               <div class="flex gap-2 items-center">
                 <div class="size-3 rounded-full bg-purple-600 mr-2"></div>
                 <h2 class="font-medium text-base">Closed</h2>
               </div>
            </div>
          </section>


          <!-- issues card section -->
           <section id="card-container" class=" p-4 rounded-md  shadow mb-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">

              <!-- show card with dynamically -->
           </section>

           
           <!-- modal section -->
            <!-- Open the modal using ID.showModal() method -->
          <dialog id="card_modal" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box">

              <!-- modal container -->
               <div id="modal-card-container">
                  
               </div>
              <div class="modal-action">
                <form method="dialog">
                  <!-- if there is a button in form, it will close the modal -->
                  <button class="btn btn-primary">Close</button>
                </form>
              </div>
            </div>
          </dialog>
         
    </main>

    <script src="./script/homePage.js"></script>
</body>
</html>

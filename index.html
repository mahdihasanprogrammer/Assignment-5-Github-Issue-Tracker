<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issues Tracker | Login Page</title>

    
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <!-- tailwind + daisyUI  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- stylesheet -->
     <link rel="stylesheet" href="tailwind.css">

</head>
<body class="geist-font">
    <section class="min-h-screen bg-base-200 flex items-center justify-center">

        <div class="card bg-base-100 w-full max-w-sm space-y-6 mx-5 shadow-xl p-8">

            <div class="flex flex-col items-center justify-center text-center ">
                <img class="mb-6" src="./assets/github-logo.png" alt="github-logo">
                <h2 class="font-semibold text-2xl mb-1">GitHub Issues Tracker</h2>
                <p>Sign in to manage your issues</p>
            </div>
            
            <fieldset class="fieldset">
              <label class="label font-semibold text-base text-[#1F2937]">Username</label>
              <input id="username" type="text" class="input" placeholder="Enter Username" />
              <p class="text-[#4A00FF] text-sm mb-4">Default: admin</p>

              <label class="label  font-semibold text-base text-[#1F2937]">Password</label>
              <input id="pin" type="password" class="input" placeholder="Enter Password" />
               <p class="text-[#4A00FF] text-sm">Default: admin</p>
              <button id="btn-sign" class="btn btn-primary mt-4">Sign In</button>
            </fieldset>

            <div class="flex gap-3 justify-center items-center">
                <div class="h-[1px] bg-gray-300 flex-1"></div>
                <span>Or</span>
                 <div class="h-[1px] bg-gray-300 flex-1"></div>
            </div>

            <div class="text-center">
                <p class="text-[#64748B] text-sm mb-2">Demo Credentials:</p>
                <div class="bg-gray-100 rounded-md py-6">
                    <h2><span class="font-semibold">Username:</span> admin</h2>
                    <h2><span class="font-semibold">Password:</span> admin123</h2>
                </div>
            </div>
        </div>
    </section>


    <script src="./script/index.js"></script>
</body>
</html>
